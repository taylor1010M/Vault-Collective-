
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vault Collective — Password Recovery</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f4ef;
  color:#171813;
  font-family:Arial,Helvetica,sans-serif;
}
header{
  padding:25px;
  text-align:center;
  border-bottom:1px solid #deded5;
}
.logo{
  font-size:23px;
  font-weight:900;
}
.logo span{color:#77786f}
.card{
  max-width:440px;
  margin:50px auto;
  background:white;
  padding:30px;
  border:1px solid #deded5;
}
h1{
  font-size:29px;
  letter-spacing:-1px;
}
p{
  color:#77786f;
  font-size:14px;
  line-height:1.6;
}
input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:1px solid #deded5;
  font-size:16px;
}
button{
  width:100%;
  padding:16px;
  margin-top:12px;
  background:#171813;
  color:white;
  border:0;
  cursor:pointer;
  font-size:11px;
  letter-spacing:1px;
}
button:disabled{opacity:.5}
a{
  color:#171813;
  font-size:13px;
}
[hidden]{display:none!important}
@media(max-width:500px){
  .card{margin:30px 5%;padding:24px}
}
</style>
</head>

<body>

<header>
  <div class="logo">
    VAULT<span>COLLECTIVE.</span>
  </div>
</header>

<section class="card">

  <p>PRIVATE ADMIN ACCESS</p>

  <h1 id="heading">Reset your password.</h1>

  <form id="requestForm">
    <p>Enter your admin email address to receive a password recovery link.</p>

    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="email"
      required
    >

    <button type="submit">
      SEND RECOVERY LINK
    </button>
  </form>

  <form id="resetForm" hidden>

    <p>Choose a new password for your admin account.</p>

    <input
      id="password"
      type="password"
      placeholder="New password"
      autocomplete="new-password"
      minlength="12"
      required
    >

    <input
      id="confirmPassword"
      type="password"
      placeholder="Confirm new password"
      autocomplete="new-password"
      minlength="12"
      required
    >

    <button type="submit">
      UPDATE PASSWORD
    </button>

  </form>

  <p id="message" role="status"></p>

  <a href="/admin.html">
    Return to admin login
  </a>

</section>

<script>
"use strict";

const db = window.supabase.createClient(
  "https://btjlvqywiphjynbfeurl.supabase.co",
  "sb_publishable_ywJizFeRjLteUpiwRVdMkw_zza6OQQn"
);

const ADMIN_UID =
  "75a7f9c1-c2d4-403b-981d-3c707e09de38";

const $ = id => document.getElementById(id);

let recoveryReady = false;

db.auth.onAuthStateChange((event, session) => {

  if(event === "PASSWORD_RECOVERY"){

    if(!session || session.user.id !== ADMIN_UID){
      $("message").textContent =
        "This account is not authorised.";
      return;
    }

    recoveryReady = true;

    $("requestForm").hidden = true;
    $("resetForm").hidden = false;

    $("heading").textContent =
      "Create a new password.";

    $("message").textContent = "";
  }
});

$("requestForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const button =
      event.currentTarget.querySelector("button");

    button.disabled = true;

    $("message").textContent =
      "Sending recovery email...";

    try{

      const {error} =
        await db.auth.resetPasswordForEmail(
          $("email").value.trim(),
          {
            redirectTo:
              "https://vault-collective-eta.vercel.app/reset-password.html"
          }
        );

      if(error) throw error;

      $("message").textContent =
        "If your account exists, check your email for a recovery link.";

    }catch(error){

      $("message").textContent =
        "Unable to send recovery email: " +
        error.message;

    }finally{
      button.disabled = false;
    }
  }
);

$("resetForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const password = $("password").value;
    const confirmation =
      $("confirmPassword").value;

    if(!recoveryReady){
      $("message").textContent =
        "Please request a new recovery link.";
      return;
    }

    if(password.length < 12){
      $("message").textContent =
        "Use at least 12 characters.";
      return;
    }

    if(password !== confirmation){
      $("message").textContent =
        "Passwords do not match.";
      return;
    }

    const button =
      event.currentTarget.querySelector("button");

    button.disabled = true;

    try{

      const {data:authData,error:authError} =
        await db.auth.getUser();

      if(
        authError ||
        !authData.user ||
        authData.user.id !== ADMIN_UID
      ){
        throw new Error(
          "Recovery session is invalid."
        );
      }

      const {error} =
        await db.auth.updateUser({
          password:password
        });

      if(error) throw error;

      recoveryReady = false;

      $("password").value = "";
      $("confirmPassword").value = "";

      $("resetForm").hidden = true;

      $("heading").textContent =
        "Password updated.";

      const {error:signOutError} =
        await db.auth.signOut();

      $("message").textContent = signOutError
        ? "Password updated. Please sign out before signing in again."
        : "Your password has been changed. You can now sign in to your admin dashboard.";

    }catch(error){

      $("message").textContent =
        error.message;

    }finally{
      button.disabled = false;
    }
  }
);
</script>

</body>
</html>
